[package]
name = "hammurabi-android"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/canmenzo/hammurabi"
publish = false

# libhammurabi_android.so, loaded by the app (android/app, Native.kt).
[lib]
crate-type = ["cdylib"]

[dependencies]
hammurabi = { path = "../..", default-features = false }
anyhow = "1"
crossbeam-channel = "0.5"
jni = "0.22"
log = "0.4"
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
# As the hammurabi crate's Android dependency: the app's libonnxruntime.so, loaded at run time.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic"] }

[profile.release]
lto = "thin"
