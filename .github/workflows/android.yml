name: Android

on:
  # Any branch, so a fork's branch builds an APK too.
  push:
    paths: &android
      - "android/**"
      - "src/**"
      - "assets/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android.yml"
  pull_request:
    paths: *android
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  apk:
    name: apk (arm64)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: android/rust

      # The runner's Android SDK has the NDK; cargo-ndk finds it through ANDROID_NDK_HOME.
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Format check
        working-directory: android/rust
        run: cargo fmt --check

      - name: Clippy
        working-directory: android/rust
        run: cargo ndk --target arm64-v8a clippy

      # Builds the engine (the app's buildRust task) and the app.
      - name: Build the APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Upload the APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hammurabi-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload the on-device tests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hammurabi-android-tests
          path: android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error

      # After the upload: what lint finds does not keep the APK from being tried.
      - name: Lint
        working-directory: android
        run: |
          status=0
          ./gradlew --no-daemon lintDebug || status=$?
          cat app/build/reports/lint-results-debug.txt || true
          exit $status

  # The on-device tests and the app as a person uses it, on an emulator: a failure shows here, with
  # Android's log of it.
  opens:
    name: runs on an emulator
    needs: apk
    # Also when only lint failed: the APKs are uploaded before it.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hammurabi-android
          path: apk

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hammurabi-android-tests
          path: apk

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # An x86_64 image: it runs the app's arm64 code by translation. A phone's screen size, so the
      # text read is a phone's.
      - name: Test on the emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 6000M
          disable-animations: true
          script: sh android/smoke.sh apk/app-debug.apk apk/app-debug-androidTest.apk
